<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<title>sak_Uta NEXT</title>
<link rel="manifest" href="manifest.webmanifest?v=20260821-16">
<link rel="stylesheet" href="styles.css?v=20260821-16">
<link rel="stylesheet" href="detail-enhance.css?v=20260821-16">
</head>
<body>
<header class="topbar">
  <div>
    <div class="brand">sak_Uta <span>NEXT</span></div>
    <div class="sub">次に歌う曲を選ぶ</div>
  </div>
  <div class="headActions">
    <span id="syncStatus" class="syncStatus" title="Google Sheets同期状態">固定データ</span>
    <button class="iconbtn" id="syncBtn" aria-label="シートを再読み込み">↻</button>
    <button class="iconbtn" id="infoBtn" aria-label="情報">ⓘ</button>
  </div>
</header>

<main>
  <section class="searchbox">
    <input id="search" type="search" placeholder="曲名・アーティストで検索">
    <button id="addCandidateBtn" type="button">＋ 新しい候補を追加</button>
  </section>

  <section class="filterGroups" id="filterGroups">
    <div class="filters" id="statusFilters"></div>
  </section>

  <div class="sortrow">
    <span id="count"></span>
    <select id="sort">
      <option value="priority">おすすめ順</option>
      <option value="fame">知名度</option>
      <option value="loadAsc">負荷：低い順</option>
      <option value="loadDesc">負荷：高い順</option>
      <option value="identity">自分らしさ</option>
    </select>
  </div>

  <section id="list" class="list"></section>
</main>

<nav class="bottomnav">
  <button class="active">⌂<small>ホーム</small></button>
  <button id="filterJump">≡<small>絞り込み</small></button>
  <button id="historyJump">◷<small>履歴</small></button>
  <button id="favOnly">☆<small>お気に入り</small></button>
</nav>

<dialog id="detail">
  <div class="modalHead">
    <button id="closeDetail" class="iconbtn">‹</button>
    <strong>曲の詳細</strong>
    <button id="favBtn" class="iconbtn">☆</button>
  </div>
  <div id="detailBody"></div>
</dialog>

<dialog id="addCandidate">
  <div class="modalHead">
    <button id="closeAddCandidate" class="iconbtn" type="button" aria-label="閉じる">‹</button>
    <strong>新しい候補を追加</strong>
    <span></span>
  </div>
  <form id="addCandidateForm" class="candidateForm">
    <p>まずは最低限の情報だけ登録できます。音域などは後から追加できます。</p>
    <label>アーティスト <b>必須</b><input name="artist" maxlength="200" autocomplete="off" required></label>
    <label>曲名 <b>必須</b><input name="title" maxlength="200" autocomplete="off" required></label>
    <label>一覧タグ
      <select name="status">
        <option value="候補">タグなし（通常候補）</option>
        <option value="⭐有力">★ 有力</option>
        <option value="リクエスト">リクエスト</option>
        <option value="再録候補">再録</option>
        <option value="コラボ">コラボ</option>
      </select>
    </label>
    <label>推奨キー <input name="key" maxlength="100" placeholder="原キーから試す、-1 など"></label>
    <label>選曲理由 <textarea name="reason" rows="4" maxlength="1000" placeholder="歌ってみたい理由や候補に入れたきっかけ"></textarea></label>
    <button class="primary" type="submit">候補へ登録する</button>
    <span id="addCandidateStatus" class="formStatus" aria-live="polite"></span>
  </form>
</dialog>

<dialog id="info">
  <div class="infoPane">
    <h2>sak_Uta NEXT</h2>
    <p>次に歌う候補をスマホで選ぶためのWebアプリです。</p>
    <p><b>音域負荷</b>：★が多いほど、現在の歌唱能力に対する負荷が高い想定です。</p>
    <p><b>Google Sheets同期</b>：候補シートからサイト起動時と↻ボタンで最新データを読み込みます。</p>
    <p><b>歌準備アプリ連携</b>：<code>config.js</code> の <code>PREP_APP_URL</code> に準備アプリURLを設定すると、曲名・アーティスト・推奨キーを渡せます。</p>
    <button id="closeInfo" class="primary">閉じる</button>
  </div>
</dialog>

<script src="config.js?v=20260821-16"></script>
<script src="list-filters.js?v=20260821-16"></script>
<script src="app.js?v=20260821-16"></script>
<script src="sheet-sync-jsonp.js?v=20260821-16"></script>
<script src="sheet-write.js?v=20260821-16"></script>
<script src="readiness.js?v=20260821-16"></script>
<script src="detail-enhance.js?v=20260821-16"></script>
<script src="candidate-add.js?v=20260821-16"></script>
<script>
(async () => {
  if ("serviceWorker" in navigator) {
    try {
      const regs = await navigator.serviceWorker.getRegistrations();
      for (const reg of regs) await reg.unregister();
    } catch (e) {}
  }
  if ("caches" in window) {
    try {
      const keys = await caches.keys();
      await Promise.all(keys.map(k => caches.delete(k)));
    } catch (e) {}
  }
})();
</script>

</body>
</html>
