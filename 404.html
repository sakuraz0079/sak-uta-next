<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<title>sak_Uta NEXT</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div>
    <div class="brand">sak_Uta <span>NEXT</span></div>
    <div class="sub">次に歌う曲を選ぶ</div>
  </div>
  <button class="iconbtn" id="infoBtn" aria-label="情報">ⓘ</button>
</header>

<main>
  <section class="searchbox">
    <input id="search" type="search" placeholder="曲名・アーティストで検索">
  </section>

  <section class="mood">
    <button data-mood="hot">🔥 気合い</button>
    <button data-mood="challenge">★ 少し挑戦</button>
    <button data-mood="easy">🎤 楽に</button>
    <button data-mood="famous">👑 有名曲</button>
    <button data-mood="identity">♫ 自分らしく</button>
  </section>

  <section class="filters" id="statusFilters"></section>

  <div class="sortrow">
    <span id="count"></span>
    <select id="sort">
      <option value="priority">おすすめ順</option>
      <option value="fame">知名度</option>
      <option value="loadAsc">負荷：低い順</option>
      <option value="loadDesc">負荷：高い順</option>
      <option value="identity">自分らしさ</option>
    </select>
  </div>

  <section id="list" class="list"></section>
</main>

<nav class="bottomnav">
  <button class="active">⌂<small>ホーム</small></button>
  <button id="filterJump">≡<small>絞り込み</small></button>
  <button id="moodJump">◎<small>気分で選ぶ</small></button>
  <button id="favOnly">☆<small>お気に入り</small></button>
</nav>

<dialog id="detail">
  <div class="modalHead">
    <button id="closeDetail" class="iconbtn">‹</button>
    <strong>曲の詳細</strong>
    <button id="favBtn" class="iconbtn">☆</button>
  </div>
  <div id="detailBody"></div>
</dialog>

<dialog id="info">
  <div class="infoPane">
    <h2>sak_Uta NEXT</h2>
    <p>次に歌う候補をスマホで選ぶための試作版です。</p>
    <p><b>音域負荷</b>：★が多いほど、今の歌唱能力に対する負荷が高い想定です。</p>
    <p><b>歌準備アプリ連携</b>：<code>app.js</code> の <code>PREP_APP_URL</code> に準備アプリURLを設定すると、曲名・アーティスト・推奨キーを渡せます。</p>
    <button id="closeInfo" class="primary">閉じる</button>
  </div>
</dialog>

<script src="config.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
